<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect tidyTIVI</title>
<style>body{background:#0f1620;color:#fff;font:16px system-ui,sans-serif;margin:0;padding:48px 24px}main{max-width:380px;margin:auto}h1{font-size:25px;font-weight:500;margin:0 0 28px}label{display:block;margin-bottom:9px}input,button{font:inherit;box-sizing:border-box;width:100%;border-radius:6px;padding:15px}input{border:1px solid #64717f;background:#172331;color:#fff;margin-bottom:16px}button{border:0;background:#0793d7;color:#fff;font-weight:500}p{color:#b8c5d1;font-size:13px}</style>
<main><h1>Connect tidyTIVI</h1><label for="setup" style="background:#0793d7;padding:16px;border-radius:6px;text-align:center;cursor:pointer">Choose setup file</label><input id="setup" type="file" accept=".json,application/json" style="position:absolute;width:1px;height:1px;opacity:0;padding:0"><p id="status" role="status">Select the tidyTIVI setup file sent to you.</p><details><summary>Enter a link instead</summary><form id="connect" method="post"><label for="url">Dropbox link</label><input id="url" name="url" type="url" placeholder="Paste your link" required maxlength="4096" autocomplete="off" autocapitalize="none" spellcheck="false"><button type="submit">Connect</button></form></details></main>
<script>
function parseSetup(text){
 const data=JSON.parse(text);
 if(!data||data.schema!=='tidytivi.connection.v1'||typeof data.download_url!=='string'||data.download_url.length>4096)throw Error('Invalid setup file.');
 const url=new URL(data.download_url);
 if(url.protocol!=='https:'||!url.hostname||url.username||url.password)throw Error('Invalid download link.');
 return data.download_url;
}
document.getElementById('setup').onchange=async function(){
 const status=document.getElementById('status'),file=this.files[0];if(!file)return;
 try{if(file.size>16384)throw Error('File too large.');
 const link=parseSetup(await file.text());document.getElementById('url').value=link;
 status.textContent='Connecting…';document.getElementById('connect').requestSubmit();
 }catch(e){status.textContent='Choose a valid tidyTIVI setup file, or enter your link below.';this.value='';}
};
</script></html>
